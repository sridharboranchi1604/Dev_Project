<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Bro… You Need To See This 😂</title>

  <link rel="stylesheet" href="./style.css">

</head>


<body>

  <!-- Background Glow -->

  <div class="page-glow glow-one"></div>

  <div class="page-glow glow-two"></div>


  <!-- Main Card -->

  <main class="card prank-card">


    <!-- Badge -->

    <div class="top-badge">

      <span class="live-dot"></span>

      PRIVATE FRIEND CHECK

    </div>


    <!-- Video -->

    <div class="video-wrapper">

      <video autoplay muted loop playsinline preload="auto">

        <source src="./reaction.mp4" type="video/mp4">

        Your browser does not support
        HTML5 video.

      </video>


      <div class="video-overlay">

        <div class="video-caption">

          😂 BRO… WHAT ARE YOU DOING?

        </div>

      </div>

    </div>


    <!-- Big Emoji -->

    <div class="emoji-big">

      😂

    </div>


    <!-- Heading -->

    <h1>

      Bro… <span>WAIT.</span>

    </h1>


    <!-- Description -->

    <p class="hero-subtitle">

      We need to verify something very important.

      <br>

      And yes…

      <strong>100% serious.</strong> 😭

    </p>


    <!-- Consent Information -->

    <!-- <p class="consent-note">

      By continuing, your browser will ask whether
      you want to share your current location.

    </p> -->


    <!-- Action -->

    <div class="action-area">

      <p class="action-hint">

        Ready? Don't overthink it. 😂

      </p>


      <button id="shareBtn" class="main-button" type="button">

        <span class="button-icon">

          😂

        </span>


        <span>

          Continue Verification

        </span>


        <span class="button-arrow">

          →

        </span>

      </button>

    </div>


    <!-- Status -->

    <p id="status" class="status">

      Waiting for your extremely important
      decision…

    </p>


    <!-- Result -->

    <div id="result" class="result hidden"></div>


    <!-- Footer -->

    <div class="tiny-footer">

      Made for friends who don't trust each other 😂

    </div>


  </main>


  <!-- Firebase / Application JS -->

  <script type="module" src="./app.js"></script>


</body>

</html>
